sonar.projectKey=nivo-fe
sonar.projectName=Nivo Frontend
sonar.host.url=https://sonar.starci.org
sonar.sourceEncoding=UTF-8

sonar.sources=apps,packages
sonar.tests=apps,packages
sonar.exclusions=**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.*,**/.next/**,**/node_modules/**,**/coverage/**,**/src/messages/**,**/.artifacts/**,**/design-plans/**
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.test.exclusions=**/*.e2e-spec.*
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPaths=apps/app/tsconfig.json,apps/expert/tsconfig.json,apps/landing/tsconfig.json,packages/ui/tsconfig.json

# The JS/TS analyzer runs in a bridge Node process whose default heap is sized for a
# small project. Four Next.js workspaces overrun it, and the bridge then dies mid-analysis
# with "bridge server is unresponsive" -- which surfaces as a failed scan, not a result.
sonar.javascript.node.maxspace=8192
