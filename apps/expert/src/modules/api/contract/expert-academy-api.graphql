"""
Nivo could not complete the provider sign-in because an authority did not answer; continue with the continuation reference from this browser, or start a fresh provider sign-in when none is returned. This is never a refusal.
"""
type AuthBrokeredUndecided {
  """
  Opaque continuation reference for `continueBrokeredSignIn` from the same browser; null means start a fresh provider sign-in. Never a credential.
  """
  continuationReference: String
}

"""A Login operation that concluded on purpose without issuing a session."""
type AuthConclusion {
  """Why no session was issued."""
  reason: AuthConclusionReason!
}

"""Why a Login operation concluded without a session."""
enum AuthConclusionReason {
  """
  The proven address already has a Login identity; sign in or recover the password.
  """
  heldAddress

  """The password changed; sign in with the new password."""
  passwordResetConfirmed

  """The identity was created; sign in with the password just set."""
  registeredSignInRequired
}

"""
Auth payload carrying the access token (refresh token stays in an HttpOnly cookie), or a pending two-factor challenge when the account has 2FA enabled.
"""
type AuthPayload {
  """
  Access token (JWT) used as the Bearer credential. Null when a two-factor code is still required.
  """
  accessToken: String

  """Whether a TOTP code is required to complete this sign-in."""
  requiresTwoFactor: Boolean!

  """
  Opaque challenge token for `verifyTwoFactor`; present only when `requiresTwoFactor` is true.
  """
  twoFactorToken: String
}

"""
Nivo could not complete this request because an authority did not answer; resubmit with the same request identity. This is never a refusal.
"""
type AuthUndecided {
  """
  Always true: resubmitting the same request identity continues this request.
  """
  retryWithSameRequest: Boolean!
}

