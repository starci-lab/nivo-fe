"""
Input for continuing a brokered sign-in under the reference the completion returned.
"""
input ContinueBrokeredSignInInput {
  """
  Opaque continuation reference returned by `exchangeOauthCode`; present it from the same browser. Never a credential.
  """
  continuationReference: String!
}

"""
The brokered continuation result: a released session, a pending second factor, the undecided shape, or the recoverable provider-email refusal. Never the refusal value.
"""
type ContinueBrokeredSignInPayload {
  """
  Access token (JWT) used as the Bearer credential. Null when a two-factor code is still required.
  """
  accessToken: String

  """
  Present only for a held subject with no verified email; offer password registration or sign-in.
  """
  providerEmailRefused: Boolean

  """Whether a TOTP code is required to complete this sign-in."""
  requiresTwoFactor: Boolean!

  """
  Opaque challenge token for `verifyTwoFactor`; present only when `requiresTwoFactor` is true.
  """
  twoFactorToken: String

  """
  Present only when an authority did not answer or the hold lapsed; start a fresh provider sign-in. Never a refusal.
  """
  undecided: AuthUndecided
}

"""Response wrapper for the continueBrokeredSignIn mutation."""
type ContinueBrokeredSignInResponse {
  """
  Payload containing the access token (refresh token is set as a cookie).
  """
  data: ContinueBrokeredSignInPayload

  """The error of the response."""
  error: String

  """The message of the response."""
  message: String!

  """
  Structured error detail, when the failed operation's exception carried any.
  """
  metadata: JSONObject

  """The success of the response."""
  success: Boolean!
}

