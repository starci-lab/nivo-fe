fragment AcademyStudentFields on AcademyStudentView {
    id
    name
    email
    role
    status
    xp
}

fragment AcademyCredentialStatusFields on AcademyCredentialStatusType {
    key
    configured
    hint
    syncedAt
    verification
    verificationReason
    verifiedAt
}

fragment AcademyCustomDomainStateFields on AcademyCustomDomainStateType {
    domain
    target
    dnsReady
    delivery
    detail
}

fragment AcademyProviderStatusFields on AcademyProviderStatusType {
    provider
    status
    clientId
    identifier
    consentMode
    reason
    deliveredAt
    verifiedAt
}

fragment AcademyWebhookStatusFields on AcademyWebhookStatusType {
    id
    endpoint
    events
    enabled
    version
    lastDeliveryStatus
    lastDeliveredAt
}

fragment ExpertSiteLeadFields on ExpertSiteLeadEntity {
    id
    name
    contact
    message
    status
    note
}

query MyAcademyGrowthSnapshot($request: MyAcademyGrowthSnapshotRequest!) {
    myAcademyGrowthSnapshot(request: $request) {
        data {
            revenueVnd
            paidOrders
            totalMembers
            activeMembers
            totalCompletions
        }
        message
        success
        error
    }
}

query MyAcademyStudents($input: MyAcademyStudentsInput!) {
    myAcademyStudents(request: $input) {
        data {
            items {
                ...AcademyStudentFields
            }
            total
        }
        message
        success
        error
    }
}

query MyAcademyStudentDetail($request: MyAcademyStudentDetailRequest!) {
    myAcademyStudentDetail(request: $request) {
        data {
            member {
                id
                name
                email
                role
                status
            }
            orders {
                id
                courseSlug
                status
                amountVnd
            }
            courses {
                slug
                title
                completed
                total
            }
        }
        message
        success
        error
    }
}

query MyAcademyIntegrations($request: MyAcademyIntegrationsRequest!) {
    myAcademyIntegrations(request: $request) {
        data {
            credentials {
                ...AcademyCredentialStatusFields
            }
            customDomain {
                ...AcademyCustomDomainStateFields
            }
            google {
                ...AcademyProviderStatusFields
            }
            zalo {
                ...AcademyProviderStatusFields
            }
            analytics {
                ...AcademyProviderStatusFields
            }
            webhooks {
                ...AcademyWebhookStatusFields
            }
        }
        message
        success
        error
    }
}

query MyExpertSiteLeads($request: MyExpertSiteLeadsRequest!) {
    myExpertSiteLeads(request: $request) {
        data {
            ...ExpertSiteLeadFields
        }
        message
        success
        error
    }
}

