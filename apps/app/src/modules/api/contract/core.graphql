  Set only when observer is dual_condition -- the two proofs that together make the completion real.
  """
  dualConditionEvidence: DualConditionEvidenceGraphQLType

  """Pointer to supporting evidence."""
  evidenceRef: String

  """Id of the completion event."""
  id: ID!

  """Id of the instance this event belongs to."""
  instanceId: ID!

  """True when only part of the subject was completed."""
  isPartial: Boolean!

  """Goods, service, or a service already paid for in advance."""
  kind: CompletionKind!

  """Who/what observed the completion."""
  observer: CompletionObserver!

  """When nivo's own system recorded this fact."""
  recordedAt: DateTime!

  """Id of the subject row."""
  subjectId: ID!

  """What kind of row this event completes."""
  subjectType: CompletionSubjectType!
}

"""
What kind of thing was completed -- drives the tax-timestamp rule (business.md section 2/3.1).
"""
enum CompletionKind {
  goods
  service
  service_paid_in_advance
}

"""
Who or what observed a completion. A completion event without one of these named is rejected.
"""
enum CompletionObserver {
  """A carrier's own delivery webhook reported completion."""
  carrier_webhook

  """The customer confirmed completion."""
  customer_confirmation

  """
  Both halves of a dual-condition completion are true (e.g. shipment delivered AND install appointment closed).
  """
  dual_condition

  """The business itself attests completion."""
  self

  """A signed record attests completion."""
  signed_record
}

"""What kind of row a completion event closes out."""
enum CompletionSubjectType {
  appointment
  custody_ticket
  order
  project_milestone
  shipment
}

