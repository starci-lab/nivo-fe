"""Input for minting a presigned document-upload URL."""
input CreatePresignInput {
  """MIME type of the upload."""
  contentType: String!

  """The filename about to be uploaded."""
  filename: String!
}

"""A presigned, short-TTL, single-object, PUT-only upload URL."""
type CreatePresignResponse {
  bucket: String!
  contentType: String!
  expiresAt: DateTime!
  objectKey: String!
  url: String!
}

"""
A date-time string at UTC, such as 2019-12-03T09:54:33Z, compliant with the date-time format.
"""
scalar DateTime

