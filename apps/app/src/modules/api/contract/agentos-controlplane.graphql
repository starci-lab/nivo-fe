type Mutation {
  bindChatbotChannel(request: BindChatbotChannelInput!): ChatbotActionPayload!
  cancelSalesReferral(request: CancelSalesReferralInput!): SalesReferralPayload!
  confirmIdentityLink(request: ConfirmIdentityLinkInput!): IdentityAssociationPayload!
  correctSalesReferralAttribution(request: CorrectSalesReferralAttributionInput!): SalesReferralPayload!

  """
  Mint a presigned, PUT-only upload URL against this instance's own MinIO.
  """
  createPresign(request: CreatePresignInput!): CreatePresignResponse!
  previewIdentityLink(request: PreviewIdentityLinkInput!): IdentityLinkPayload!
  rebindChannel(request: RebindChatbotChannelInput!): ChatbotChannelTransferPayload!
  reconcileChatbotDelivery(request: ReconcileChatbotDeliveryInput!): ChatbotActionPayload!
  recordChannelProof(request: RecordChannelProofInput!): IdentityLinkPayload!
  recordLinkConsent(request: RecordLinkConsentInput!): IdentityLinkPayload!
  resolveChatbotHandoff(request: ChangeChatbotHandoffInput!): ChatbotActionPayload!
  retryChatbotReply(request: RetryChatbotReplyInput!): ChatbotActionPayload!

  """Enqueue (and spawn, if idle) the nivo-cli index-pending drain."""
  runRagJob(request: RunRagJobInput): RunRagJobResponse!
  salesAnswerDecision(request: SalesAnswerDecisionInput!): SalesOperationResult!
  salesCancelNoStart(request: SalesCancelNoStartInput!): SalesOperationResult!
  salesClose(request: SalesCloseInput!): SalesOperationResult!
  salesConfigure(request: SalesConfigureInput!): SalesOperationResult!
  salesCorrectReferralAttribution(request: SalesReferralCorrectAttributionInput!): SalesOperationResult!
  salesExecuteCommand(request: SalesExecuteCommandInput!): SalesOperationResult!
  salesNarrow(request: SalesNarrowInput!): SalesOperationResult!
  salesPrepareHandoff(request: SalesPrepareHandoffInput!): SalesOperationResult!
  salesProgress(request: SalesProgressInput!): SalesOperationResult!
  salesReconcile(request: SalesReconcileInput!): SalesOperationResult!
  salesRemove(request: SalesRemoveInput!): SalesOperationResult!
  salesRequestDecision(request: SalesRequestDecisionInput!): SalesOperationResult!
  salesRetryNoStart(request: SalesRetryNoStartInput!): SalesOperationResult!
  salesRevoke(request: SalesRevokeInput!): SalesOperationResult!
  salesRotate(request: SalesRotateInput!): SalesOperationResult!
  salesSubmitPreparedHandoff(request: SalesSubmitPreparedHandoffInput!): SalesOperationResult!
  salesSubmitReferral(request: SalesReferralSubmitInput!): SalesOperationResult!
  setChatbotHandoff(request: ChangeChatbotHandoffInput!): ChatbotActionPayload!
  startZaloChatbotAuthorization(request: StartZaloChatbotAuthorizationInput!): ChatbotActionPayload!
  submitSalesReferral(request: SubmitSalesReferralInput!): SalesReferralPayload!
  unlinkIdentity(request: UnlinkIdentityInput!): IdentityAssociationPayload!

  """Store (encrypted) one channel's credential and issue its webhook path."""
  writeChannelKey(request: WriteChannelKeyInput!): WriteChannelKeyResponse!
}

