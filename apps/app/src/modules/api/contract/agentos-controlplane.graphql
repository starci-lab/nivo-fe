  identityLink(request: IdentityLinkInput!): IdentityLinkPayload!
  linkedContext(request: LinkedContextInput!): LinkedContextPayload!
  moduleOverviewApplied(request: ModuleOverviewAppliedRequest!): ModuleOverviewAppliedType!
  moduleOverviewSummary(request: ModuleOverviewSummaryRequest!): ModuleOverviewSummaryType!
  moduleOverviewTarget(request: ModuleOverviewTargetRequest!): ModuleTargetResolutionType!
  salesLookupReferralReceipt(request: SalesReferralLookupInput!): SalesOperationResult!
  salesPipeline(request: SalesPipelineInput!): SalesOperationResult!
  salesReadiness(request: SalesReadinessInput!): SalesOperationResult!
  salesReferral(request: SalesReferralInput!): SalesReferralPayload!
}

