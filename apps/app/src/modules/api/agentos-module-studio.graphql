fragment AgentosCustomModuleFields on AgentosCustomModuleEntity {
    id
    agentWorkspaceId
    name
    status
    progress
    missingFields
    currentQuestion
    specificationVersion
    installationId
    failureCode
}

fragment AgentosModuleStudioFields on AgentosModuleStudioView {
    module {
        ...AgentosCustomModuleFields
    }
    profileFacts {
        key
        value
    }
    messages {
        id
        role
        content
        sequence
    }
    attachments {
        id
        fileName
        mediaType
        sizeBytes
        status
        ingestionStatus
        detectedMediaType
        sha256
        chunkCount
        indexedAt
        retrievalRemovedAt
        objectDeletionStatus
        objectDeletionDueAt
        failureCode
    }
    integrations {
        id
        providerKey
        maskedHint
        status
    }
    specification {
        id
        version
        status
    }
}

fragment AgentosModuleUploadCapabilityFields on PrepareAgentosModuleAttachmentUploadView {
    module {
        ...AgentosCustomModuleFields
    }
    profileFacts {
        key
        value
    }
    messages {
        id
        role
        content
        sequence
    }
    attachments {
        id
        fileName
        mediaType
        sizeBytes
        status
        ingestionStatus
        detectedMediaType
        sha256
        chunkCount
        indexedAt
        retrievalRemovedAt
        objectDeletionStatus
        objectDeletionDueAt
        failureCode
    }
    integrations {
        id
        providerKey
        maskedHint
        status
    }
    specification {
        id
        version
        status
    }
    attachmentId
    uploadUrl
    uploadMethod
    uploadExpiresAt
}

query MyAgentosCustomModuleStudio($request: MyAgentosCustomModuleStudioRequest!) {
    myAgentosCustomModuleStudio(request: $request) {
        data {
            ...AgentosModuleStudioFields
        }
        message
        success
        error
    }
}

