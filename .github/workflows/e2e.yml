name: e2e (manual)

# e2e runs MANUALLY only (owner ruling 2026-09-29): this workflow has no push / pull_request
# trigger, and its results never feed coverage. Start it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Built application HTTP E2E
        env:
          NEXT_PUBLIC_CORE_API_URL: http://localhost:3068/graphql
          NEXT_PUBLIC_ACADEMY_API_URL: http://localhost:4068/graphql
        run: npm run test:e2e
